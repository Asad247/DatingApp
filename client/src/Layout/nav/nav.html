<header
  class="fixed top-0 left-0 w-full z-50 h-20 flex items-center justify-between px-8 shadow-lg bg-[#1a0f1f]/80 backdrop-blur-xl border-b border-white/5 transition-all duration-300"
>
  <div class="flex items-center">
    <a
      routerLink="/"
      style="font-family: 'Dancing Script', cursive"
      class="text-4xl text-white drop-shadow-md hover:text-cyan-400 transition-colors"
    >
      Interaction Hub
    </a>
  </div>

  @if (accountService.currentUser()) {
    <nav
      class="absolute left-1/2 transform -translate-x-1/2 flex items-center gap-2 bg-white/5 p-1.5 rounded-full border border-white/10 backdrop-blur-md"
    >
      <a
        routerLink="/members"
        routerLinkActive="text-cyan-400 bg-white/10 shadow-[inset_0_0_15px_rgba(8,145,178,0.2)]"
        class="px-6 py-2 rounded-full text-sm font-medium tracking-wide text-white/70 hover:text-white hover:bg-white/10 transition-all duration-300"
      >
        Matches
      </a>
      <a
        routerLink="/lists"
        routerLinkActive="text-cyan-400 bg-white/10 shadow-[inset_0_0_15px_rgba(8,145,178,0.2)]"
        class="px-6 py-2 rounded-full text-sm font-medium tracking-wide text-white/70 hover:text-white hover:bg-white/10 transition-all duration-300"
      >
        Lists
      </a>
      <a
        routerLink="/messages"
        routerLinkActive="text-cyan-400 bg-white/10 shadow-[inset_0_0_15px_rgba(8,145,178,0.2)]"
        class="px-6 py-2 rounded-full text-sm font-medium tracking-wide text-white/70 hover:text-white hover:bg-white/10 transition-all duration-300"
      >
        Messages
      </a>
    </nav>
  }

  <div class="flex items-center">
    @if (accountService.currentUser(); as user) {
      <div class="dropdown dropdown-end">
        <div
          tabindex="0"
          role="button"
          class="flex items-center gap-3 cursor-pointer group p-1 pr-5 rounded-full bg-white/5 border border-white/10 hover:bg-white/10 transition-all duration-300"
        >
          <img
            [src]="user.photoUrl || './assets/user.png'"
            alt="User Icon"
            class="w-9 h-9 rounded-full object-cover ring-2 ring-cyan-500/30 group-hover:ring-cyan-400 transition-all"
          />
          <span
            class="text-sm font-medium text-white/80 group-hover:text-white transition-colors"
            >{{ user.displayName }}</span
          >
        </div>

        <ul
          tabindex="-1"
          class="dropdown-content menu mt-4 z-[1 w-56 p-2 bg-[#2d1b36]/95 backdrop-blur-xl rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.5)] border border-white/10"
        >
          <li>
            <a
              [routerLink]="['/members', user.id]"
              class="hover:bg-white/10 hover:text-cyan-400 text-white/80 rounded-xl transition-colors py-3"
              >My Profile</a
            >
          </li>
          <li>
            <a
              class="hover:bg-white/10 hover:text-cyan-400 text-white/80 rounded-xl transition-colors py-3"
              >Settings</a
            >
          </li>
          <div class="divider my-1 before:bg-white/10 after:bg-white/10"></div>
          <li>
            <a
              (click)="logout()"
              class="hover:bg-red-500/20 hover:text-red-400 text-white/80 rounded-xl transition-colors py-3"
              >Logout</a
            >
          </li>
        </ul>
      </div>
    } @else {
      <form #loginForm="ngForm" (ngSubmit)="login()" class="flex items-center gap-3">
        <input
          [(ngModel)]="creds.email"
          name="email"
          type="email"
          placeholder="Email"
          class="input input-sm h-10 w-48 bg-white/5 border-white/10 text-white placeholder-white/30 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 rounded-xl transition-all"
        />
        <input
          [(ngModel)]="creds.password"
          name="password"
          type="password"
          placeholder="Password"
          class="input input-sm h-10 w-48 bg-white/5 border-white/10 text-white placeholder-white/30 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 rounded-xl transition-all"
        />
        <button
          type="submit"
          class="btn btn-sm h-10 px-6 bg-cyan-600 hover:bg-cyan-500 border-none text-white shadow-[0_0_15px_rgba(8,145,178,0.3)] hover:shadow-[0_0_20px_rgba(8,145,178,0.5)] rounded-xl transition-all font-medium"
        >
          Login
        </button>
      </form>
    }
  </div>
</header>
