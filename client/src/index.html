<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Interaction Hub</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          sans-serif;
        color: white;
        -webkit-font-smoothing: antialiased;

        /* Premium dark background with subtle ambient radial glows */
        background-color: #110915;
        background-image:
          radial-gradient(circle at top right, rgba(45, 27, 54, 0.6) 0%, transparent 40%),
          radial-gradient(circle at bottom left, rgba(8, 145, 178, 0.15) 0%, transparent 40%);
        background-attachment: fixed;
      }

      /* Custom loading animation for the minimal bar */
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(200%);
        }
      }
      .animate-slide {
        animation: slide 1.5s ease-in-out infinite;
      }
    </style>
  </head>

  <body class="selection:bg-cyan-500/30 selection:text-cyan-100">
    <app-root></app-root>

    <div
      id="initial-splash"
      class="fixed inset-0 z-9999 flex items-center justify-center bg-[#110915] transition-opacity duration-700 ease-in-out"
    >
      <div class="flex flex-col items-center gap-8 p-10">
        <div
          class="relative flex items-center justify-center p-5 rounded-full bg-white/5 border border-white/10 shadow-[0_0_40px_rgba(8,145,178,0.2)]"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="h-10 w-10 text-cyan-400 animate-pulse"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M18 18.72a9.094 9.094 0 0 0 3.741-.479 3 3 0 0 0-4.682-2.72m.94 3.198.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0 1 12 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 0 1 6 18.719m12 0a5.971 5.971 0 0 0-.941-3.197m0 0A5.995 5.995 0 0 0 12 12.75a5.995 5.995 0 0 0-5.058 2.772m0 0a3 3 0 0 0-4.681 2.72 8.986 8.986 0 0 0 3.74.477m.94-3.197a5.971 5.971 0 0 0-.94 3.197M15 6.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm6 3a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Zm-13.5 0a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Z"
            />
          </svg>
        </div>

        <div class="text-center space-y-2">
          <h1
            class="text-5xl drop-shadow-md text-white"
            style="font-family: 'Dancing Script', cursive"
          >
            Interaction Hub
          </h1>
          <p class="text-[10px] text-cyan-400/80 font-semibold tracking-[0.3em] uppercase mt-2">
            Initializing Environment
          </p>
        </div>

        <div class="w-48 h-[2px] bg-white/10 rounded-full overflow-hidden relative mt-2">
          <div
            class="absolute top-0 left-0 h-full w-1/2 bg-cyan-400 rounded-full animate-slide shadow-[0_0_10px_rgba(8,145,178,0.8)]"
          ></div>
        </div>
      </div>
    </div>
  </body>
</html>
