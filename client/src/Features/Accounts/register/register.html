<div class="flex justify-center w-full px-4 sm:px-6 lg:px-8 mt-4">
  <div
    class="card w-full max-w-4xl bg-[#2d1b36]/40 backdrop-blur-xl shadow-2xl border border-white/5 rounded-3xl overflow-visible"
  >
    <div class="card-body p-8 sm:p-12">
      <div class="text-center mb-10">
        <h2
          class="text-5xl font-light text-white mb-3 drop-shadow-md"
          style="font-family: 'Dancing Script', cursive"
        >
          Create your account
        </h2>
        <p class="text-xs text-cyan-400/80 font-semibold tracking-[0.2em] uppercase">
          Join the interaction hub
        </p>
      </div>

      <ul class="steps">
        <li class="step" [class.step-primary]="currentStep() === 1">Credentials</li>
        <li class="step" [class.step-primary]="currentStep() === 2">Profile</li>
      </ul>

      @if (currentStep() === 1) {
        <form [formGroup]="credentialsForm" class="space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-2">
            <app-text-input label="Display Name" formControlName="displayName" />
            <app-text-input label="Email" formControlName="email" />
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-2">
            <app-text-input label="Password" formControlName="password" type="password" />
            <app-text-input
              label="Confirm Password"
              formControlName="confirmPassword"
              type="password"
            />
          </div>

          <div
            class="divider before:bg-white/5 after:bg-white/5 mt-8 mb-8 text-white/30 font-light text-xs uppercase tracking-widest"
          >
            Action
          </div>

          <div class="flex flex-col sm:flex-row gap-5">
            <button
              type="button"
              (click)="cancel()"
              class="btn flex-1 bg-transparent hover:bg-white/5 text-white border border-white/10 hover:border-white/30 transition-all duration-300 rounded-xl"
            >
              Cancel
            </button>

            <button
              type="button"
              (click)="nextStep()"
              [disabled]="!credentialsForm.valid"
              class="btn flex-1 bg-cyan-600 hover:bg-cyan-500 text-white border-none shadow-[0_0_15px_rgba(8,145,178,0.3)] hover:shadow-[0_0_25px_rgba(8,145,178,0.6)] disabled:bg-white/5 disabled:text-white/30 transition-all duration-300 rounded-xl"
            >
              Next
            </button>
          </div>

          <div class="text-center mt-8">
            <span class="text-sm text-white/50">Already have an account? </span>
            <a
              routerLink="/login"
              class="link text-cyan-400 no-underline font-medium hover:text-cyan-300 transition-colors cursor-pointer"
              >Log in</a
            >
          </div>
        </form>
      }

      @if (currentStep() === 2) {
        <form [formGroup]="profileForm" class="space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-4">
            <!-- Replace or add real profile inputs here -->
            <app-text-input label="City" formControlName="city" />
            <app-text-input label="Country" formControlName="country" />
            <div class="form-control w-full">
              <label class="label pl-0">
                <span class="label-text text-white/70">Gender</span>
              </label>
              <select
                formControlName="gender"
                class="select select-bordered w-full bg-transparent text-white border-white/10"
              >
                <option value="" disabled selected hidden>Select gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </div>
            <div class="form-control w-full">
              <label class="label pl-0">
                <span class="label-text text-white/70">Date of birth</span>
              </label>
              <input
                type="date"
                [max]="maxAllowedDate()"
                formControlName="dateOfBirth"
                class="input input-bordered w-full bg-transparent text-white border-white/10 placeholder-white/30 focus:border-cyan-400 focus:outline-none transition-colors"
              />
            </div>
          </div>

          <div class="flex flex-col sm:flex-row gap-5">
            <button
              type="button"
              (click)="lastStep()"
              class="btn flex-1 bg-transparent hover:bg-white/5 text-white border border-white/10 hover:border-white/30 transition-all duration-300 rounded-xl"
            >
              Back
            </button>

            <button
              type="button"
              (click)="register()"
              [disabled]="!profileForm.valid"
              class="btn flex-1 bg-cyan-600 hover:bg-cyan-500 text-white border-none shadow-[0_0_15px_rgba(8,145,178,0.3)] hover:shadow-[0_0_25px_rgba(8,145,178,0.6)] disabled:bg-white/5 disabled:text-white/30 transition-all duration-300 rounded-xl"
            >
              Register
            </button>
          </div>
        </form>
      }
    </div>
  </div>
</div>
