@if (member(); as member) {
<div [routerLink]="['/members', member.id]" tabindex="0"
    class="group relative overflow-hidden rounded-2xl bg-gray-800 aspect-[3/4] cursor-pointer transition-all duration-500 hover:-translate-y-2 hover:shadow-2xl hover:shadow-indigo-500/20 focus:outline-none focus:ring-4 focus:ring-indigo-500/50">
    <img [src]="member.imageUrl || '/user.png'" [alt]="member.displayName + ' profile picture'"
        class="h-full w-full object-cover transition-transform duration-700 ease-out group-hover:scale-110"
        loading="lazy" />

    <div
        class="absolute inset-0 bg-gradient-to-t from-gray-900/90 via-gray-900/30 to-transparent opacity-80 transition-opacity duration-300 group-hover:opacity-100">
    </div>

    <div
        class="absolute bottom-0 w-full p-5 translate-y-2 transition-transform duration-300 ease-out group-hover:translate-y-0">
        <div class="flex flex-col gap-1 text-white">

            <h3 class="text-xl font-bold tracking-tight flex items-baseline gap-2">
                {{ member.displayName }}
                <span class="text-sm font-medium text-indigo-300">25</span>
            </h3>

            <p class="text-sm font-medium text-gray-300 flex items-center gap-1.5 opacity-90">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
                    class="w-4 h-4 text-indigo-400">
                    <path fill-rule="evenodd"
                        d="M9.69 18.933l.003.001C9.89 19.02 10 19 10 19s.11.02.308-.066l.002-.001.006-.003.018-.008a5.741 5.741 0 00.281-.14c.186-.096.446-.24.757-.433.62-.384 1.445-.966 2.274-1.765C15.302 14.988 17 12.493 17 9A7 7 0 103 9c0 3.492 1.698 5.988 3.355 7.584a13.731 13.731 0 002.273 1.765 11.842 11.842 0 00.976.544l.062.029.018.008.006.003zM10 11.25a2.25 2.25 0 100-4.5 2.25 2.25 0 000 4.5z"
                        clip-rule="evenodd" />
                </svg>
                {{ member.city }}
            </p>

        </div>
    </div>
</div>
}
